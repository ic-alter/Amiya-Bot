<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link type="text/css" rel="styleSheet" href="font.css" />
    <link type="text/css" rel="styleSheet" href="functions.css" />
    <title>template</title>
</head>

<body>
    <div id="template">
        <div class="top">
            <div class="title">{{ data.title }}</div>
            <div class="info">{{ data.description }}</div>
        </div>
        <div class="enabled" v-if="Object.keys(data.enabled).length">
            <div class="title2" style="color: #3AB4CE">
                已启用功能：
            </div>
            <div class="pluginlist">
                <div v-for="item,index in data.enabled">
                    <div class="plugin">
                        <div class="Logo">
                            <img style="width: 80px;"
                                :src="`../../${item.plugin_id + '-' + item.version.replace(/\./g,'_')}/logo.png`"
                                onerror="DefaultImage(this)">
                            <span class="tag" v-if="item.plugin_type == 'official'">官</span>
                        </div>
                        <div class="plugininfo">
                            <div style="display: flex; justify-content: space-between">
                                <div class="Name"><span class="Index">{{ index + 1 }}</span> {{ item.name }}</div>
                                <div class="version">v{{ item.version }}</div>
                            </div>
                            <div class="Description">{{ item.description }}</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="disabled" v-if="Object.keys(data.disabled).length">
            <div class="title2" style="color: #ff6900">
                已禁用功能：
            </div>
            <div class="pluginlist">
                <div v-for="item,index in data.disabled">
                    <div class="plugin">
                        <div class="Logo">
                            <img style="width: 80px;"
                                :src="`../../${item.plugin_id + '-' + item.version.replace(/\./g,'_')}/logo.png`"
                                onerror="DefaultImage(this)">
                            <span class="tag" v-if="item.plugin_type">官</span>
                        </div>
                        <div class="plugininfo">
                            <div style="display: flex; justify-content: space-between">
                                <div class="Name"><span class="Index">{{ index + data.count + 1 }}</span> {{ item.name
                                    }}</div>
                                <div class="version">v{{ item.version }}</div>
                            </div>
                            <div class="Description">{{ item.description }}</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="js/vue.min.js"></script>
<script>
    function DefaultImage(e) {
        e.src = 'img/default.png'
    }

    const template = new Vue({
        el: '#template',
        methods: {
            init(data) {
                this.$set(this, 'data', data)
            }
        },
        data() {
            return {
                data: {}
            }
        },
        mounted() {
            window.init = this.init
        }
    })
</script>

</html>
